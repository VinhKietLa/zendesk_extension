<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Signing you in...</title>
    <link rel="icon" href="data:,">
</head>

<body>
    <p>Signing you in...</p>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import {
            getAuth,
            getRedirectResult,
            GoogleAuthProvider,
            signInWithRedirect
        } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
            authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
            projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
            storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
            messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
            appId: import.meta.env.VITE_FIREBASE_APP_ID,
            measurementId: import.meta.env.VITE_FIREBASE_MEASUREMENT_ID
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        auth.useDeviceLanguage();

        console.log("🚦 redirect.html loaded");

        // Wait a moment to let Firebase Auth catch up
        setTimeout(async () => {
            try {
                const result = await getRedirectResult(auth);
                console.log("🌐 Firebase redirect result:", result);

                if (result?.user) {
                    chrome.runtime.sendMessage({
                        type: "oauthSuccess",
                        payload: {
                            userEmail: result.user.email,
                            userId: result.user.uid,
                            userName: result.user.displayName,
                        }
                    }, () => {
                        console.log("📤 Sent user to extension");
                        document.body.innerHTML = "<h2>✅ Signed in!</h2><p>You can close this tab.</p>";
                        setTimeout(() => window.close(), 3000);
                    });
                } else {
                    console.warn("⚠️ No redirect result — initiating sign-in");
                    const provider = new GoogleAuthProvider();
                    signInWithRedirect(auth, provider);
                }
            } catch (err) {
                console.error("❌ Sign-in error:", err);
                document.body.innerHTML = `<p>❌ Sign-in failed: ${err.message}</p>`;
            }
        }, 300);
    </script>
</body>

</html>
