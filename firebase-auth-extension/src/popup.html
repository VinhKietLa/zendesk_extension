<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Hero
    </title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <h1>Agent Hero
    </h1>

    <!-- Auth Section -->
    <div id="authSection">
        <button id="loginBtn">Sign in with Google</button>
        <button id="logoutBtn" style="display: none;">Sign Out</button>
        <p id="userInfo" style="font-size: 0.9em; margin-top: 5px;"></p>
        <span id="proBadge"
            style="display: none; background-color: #4CAF50; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; margin-left: 8px;">PRO</span>
        <button id="upgradeBtn"
            style="display: none; margin-left: 8px; background-color: #4CAF50; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;">Upgrade
            to Pro</button>
    </div>

    <!-- Dark Mode Section -->
    <div class="dark-mode-toggle">
        <label>
            <input type="checkbox" id="darkModeToggle" />
            🌙 Enable Dark Mode
        </label>
    </div>

    <!-- Auto Refresh Section -->
    <h2>Auto Refresh</h2>
    <label for="refreshInterval">Auto-Refresh Interval (seconds):</label>
    <input type="number" id="refreshInterval" value="60">
    <button id="toggleRefresh">Start Auto-Refresh</button>


    <!-- Add New Ticket -->
    <h2>Add New Ticket</h2>
    <div class="ticket-form-group">
        <label for="ticketInput">Ticket ID or URL:</label>
        <input type="text" id="ticketInput" placeholder="e.g. 12345 or full Zendesk URL">

        <label for="ticketDescription">Description:</label>
        <input type="text" id="ticketDescription" placeholder="Short note or description">

        <label for="reminderTime">Reminder (optional):</label>
        <input type="datetime-local" id="reminderTime">

        <button id="addTicket">Add Ticket</button>
    </div>


    <!-- Important Tickets Section -->
    <h2>Important Tickets</h2>
    <ul id="importantTicketsList"></ul>

    <!-- Completed Tickets Section -->
    <h2>Completed Tickets</h2>
    <ul id="completedTicketsList"></ul>
    <button id="clearCompletedTickets">Clear Completed Tickets</button>


    <!-- Overdue Tickets Section -->
    <h2>Overdue Tickets</h2>
    <ul id="overdueTicketsList"></ul>


    <script type="module" src="/src/popup.js"></script>
</body>

</html>
